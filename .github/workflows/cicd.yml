name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'tests/**.py'
      - 'params.yaml'
      - 'requirements.txt'
      - '.github/workflows/cicd.yml'
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # Neu co bat ky test nao that bai, pipeline dung lai o day va khong tien hanh
  # huan luyen hay trien khai.
  # ---------------------------------------------------------------------------
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc cloud storage, pull du lieu bang DVC, huan luyen mo hinh, upload artifact.
  # Chi chay khi Job 1 (Unit Test) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}
      previous_f1: ${{ steps.previous_report.outputs.f1 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        uses: google-github-actions/auth@v3
        with:
          project_id: aitc-track2
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Pull data with DVC
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc

      - name: Train model
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.DAGSHUB_MLFLOW_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          if [ -z "$MLFLOW_TRACKING_URI" ]; then
            unset MLFLOW_TRACKING_URI
            unset MLFLOW_TRACKING_USERNAME
            unset MLFLOW_TRACKING_PASSWORD
            echo "DagsHub secrets are not configured; using the local MLflow store."
          else
            echo "Using remote MLflow tracking on DagsHub."
          fi
          python src/train.py

      - name: Read report
        id: read_report
        run: |
          F1=$(python -c "import json; d=json.load(open('outputs/report.json')); print(d['f1_score'])")
          echo "f1=$F1" >> "$GITHUB_OUTPUT"

      - name: Read current production report
        id: previous_report
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          python - <<'PYEOF'
          import json
          import os
          from google.cloud import storage

          client = storage.Client()
          bucket = client.bucket(os.environ["ARTIFACT_BUCKET"])
          blob = bucket.blob("artifacts/current/report.json")
          old_f1 = ""
          if blob.exists():
              report = json.loads(blob.download_as_text())
              old_f1 = str(report["f1_score"])
              print(f"Current production f1_score: {float(old_f1):.4f}")
          else:
              print("No production report found; this is the first guarded release.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"f1={old_f1}\n")
          PYEOF

      - name: Save deployment bundle as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: |
            outputs/report.json
            outputs/detail.txt
            models/model.joblib


  # ---------------------------------------------------------------------------
  # JOB 3 - QUALITY GATE
  # Kiem tra nguong chat luong (f1_score >= 0.65).
  # Pipeline dung lai o day neu mo hinh chua dat yeu cau.
  #
  # Luu y: nguong o day dat tren f1_score chu KHONG phai accuracy. Bo du lieu
  # Adult co ty le lop 75/25, nen mot mo hinh doan bua "thu nhap thap" cho moi
  # mau da dat accuracy 0.75 ma hoan toan vo dung.
  # Chi chay khi Job 2 (Train) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check quality gate
        run: |
          python - <<'PYEOF'
          f1 = float("${{ needs.train.outputs.f1 }}")
          previous_f1_text = "${{ needs.train.outputs.previous_f1 }}"
          if f1 < 0.65:
              raise SystemExit(
                  f"FAILED: f1_score {f1:.4f} < 0.65. Huy trien khai."
              )
          print(f"PASSED: f1_score {f1:.4f} >= 0.65.")

          if previous_f1_text:
              previous_f1 = float(previous_f1_text)
              print(
                  f"Rollback gate: candidate={f1:.4f}, "
                  f"production={previous_f1:.4f}"
              )
              if f1 < previous_f1:
                  raise SystemExit(
                      f"FAILED: candidate f1_score {f1:.4f} < "
                      f"production {previous_f1:.4f}. Giu nguyen model hien tai."
                  )
          else:
              print("Rollback gate: no production baseline; allowing first release.")

          print("PASSED: quality and rollback gates. Dang trien khai model.")
          PYEOF


  # ---------------------------------------------------------------------------
  # JOB 4 - RELEASE
  # Trien khai len VM qua SSH.
  # Chi chay khi Job 3 (Quality Gate) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Authenticate to Cloud Storage
        uses: google-github-actions/auth@v3
        with:
          project_id: aitc-track2
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Download deployment bundle
        uses: actions/download-artifact@v4
        with:
          name: report
          path: release-bundle

      - name: Upload approved model and reports
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          pip install google-cloud-storage==2.16.0
          python - <<'PYEOF'
          import os
          from google.cloud import storage

          client = storage.Client()
          bucket = client.bucket(os.environ["ARTIFACT_BUCKET"])
          uploads = {
              "release-bundle/models/model.joblib": "artifacts/current/model.joblib",
              "release-bundle/outputs/report.json": "artifacts/current/report.json",
              "release-bundle/outputs/detail.txt": "artifacts/current/detail.txt",
          }
          for source, destination in uploads.items():
              bucket.blob(destination).upload_from_filename(source)
              print(f"Uploaded {source} -> {destination}")
          PYEOF

      - name: Copy serving code to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: src/serve.py
          target: /home/${{ secrets.SERVER_USER }}

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo systemctl restart income-api
            for attempt in $(seq 1 12); do
              if curl -sf http://localhost:8080/healthz; then
                echo "Health check passed."
                exit 0
              fi
              echo "Waiting for income-api (${attempt}/12)..."
              sleep 5
            done
            sudo systemctl status income-api --no-pager || true
            sudo journalctl -u income-api -n 50 --no-pager || true
            exit 1
